<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalfScrew - Premium Audio Time-Stretch & Pitch-Shift Plugin</title>
    <meta name="description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently. Real-time processing with beautiful UI.">
    <meta name="keywords" content="audio plugin, time stretch, pitch shift, audio processing, web audio, tone.js, audio editor">
    <meta name="author" content="myaiplug">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://myaiplug.github.io/HalfScrew2/">
    <meta property="og:title" content="HalfScrew - Premium Audio Time-Stretch & Pitch-Shift Plugin">
    <meta property="og:description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently.">
    <meta property="og:image" content="https://github.com/user-attachments/assets/392f95b3-95f2-43d6-a5c6-5eed15be92ee">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://myaiplug.github.io/HalfScrew2/">
    <meta property="twitter:title" content="HalfScrew - Premium Audio Time-Stretch & Pitch-Shift Plugin">
    <meta property="twitter:description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently.">
    <meta property="twitter:image" content="https://github.com/user-attachments/assets/392f95b3-95f2-43d6-a5c6-5eed15be92ee">
    
    <!-- Favicon (using emoji as data URI for now) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Controls Drawer Toggle -->
    <button id="controls-toggle" class="controls-toggle" aria-label="Toggle controls">
        <i class="fas fa-cog"></i>
    </button>

    <!-- Sliding Controls Drawer -->
    <div id="controls-drawer" class="controls-drawer">
        <button class="control-btn" id="upload-btn" aria-label="Upload file">
            <i class="fas fa-arrow-up"></i>
        </button>
        <button class="control-btn" id="play-pause-btn" aria-label="Play/Pause">
            <i class="fas fa-play"></i>
        </button>
        <button class="control-btn" id="stop-btn" aria-label="Stop">
            <i class="fas fa-stop"></i>
        </button>
        <button class="control-btn" id="rewind-btn" aria-label="Rewind">
            <i class="fas fa-backward"></i>
        </button>
        <button class="control-btn" id="download-drawer-btn" aria-label="Download">
            <i class="fas fa-arrow-down"></i>
        </button>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-tape"></i>
            </div>
            <h1>HalfScrew</h1>
            <div class="tagline">THE <span class="slow">SLOW</span> MOTION POTION</div>
            <div class="subtitle">TUNED TO KEEP THE <span class="low-end">LOW END</span> WHERE IT BELONGS</div>
        </div>
        <div class="load-file-section">
            <button class="load-file-btn" id="load-file-btn">
                Load a file to begin.
            </button>
        </div>
        <div class="controls">
            <div class="control">
                <label for="time-shift">SPEED</label>
                <div class="knob-wrapper">
                    <input type="range" id="time-shift" min="50" max="150" value="100" class="input-knob" data-diameter="120" data-bgcolor="#e0e5ec" data-fgcolor="#a855f7" disabled>
                </div>
                <span id="time-shift-value" class="value-display">100<span class="unit">%</span></span>
            </div>
            <div class="control cassette-icon">
                <i class="fas fa-tape"></i>
            </div>
            <div class="control">
                <label for="pitch-bend">PITCH</label>
                <div class="knob-wrapper">
                    <input type="range" id="pitch-bend" min="-6" max="6" value="0" step="0.1" class="input-knob" data-diameter="120" data-bgcolor="#e0e5ec" data-fgcolor="#a855f7" disabled>
                </div>
                <span id="pitch-bend-value" class="value-display">0.0<span class="unit"> st</span></span>
            </div>
        </div>
        <input type="file" id="file-input" accept="audio/mp3,audio/wav,audio/mpeg,audio/x-wav" style="display: none;">
        <audio id="audio-player" style="display: none;"></audio>
    </div>

    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script src="lib/input-knobs.js"></script>
    <script src="script.js"></script>
</body>
</html>
