<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalfScrew - The Slow Motion Potion</title>
    <meta name="description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently. Real-time processing with beautiful UI.">
    <meta name="keywords" content="audio plugin, time stretch, pitch shift, audio processing, web audio, tone.js, audio editor">
    <meta name="author" content="myaiplug">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://myaiplug.github.io/HalfScrew2/">
    <meta property="og:title" content="HalfScrew - The Slow Motion Potion">
    <meta property="og:description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently.">
    <meta property="og:image" content="https://github.com/user-attachments/assets/392f95b3-95f2-43d6-a5c6-5eed15be92ee">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://myaiplug.github.io/HalfScrew2/">
    <meta property="twitter:title" content="HalfScrew - The Slow Motion Potion">
    <meta property="twitter:description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently.">
    <meta property="twitter:image" content="https://github.com/user-attachments/assets/392f95b3-95f2-43d6-a5c6-5eed15be92ee">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="light">
    <!-- Top left logo/icon -->
    <div class="top-left-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="10" width="40" height="28" rx="4" stroke="currentColor" stroke-width="2.5" fill="none"/>
            <circle cx="14" cy="24" r="5" stroke="currentColor" stroke-width="2" fill="none"/>
            <circle cx="34" cy="24" r="5" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M14 29 Q24 26 34 29" stroke="currentColor" stroke-width="2" fill="none"/>
            <circle cx="24" cy="8" r="2" fill="var(--accent-color)"/>
        </svg>
    </div>

    <!-- EQ button (top left, next to logo) -->
    <button class="eq-btn" id="eq-btn" aria-label="EQ Controls">
        <i class="fas fa-sliders-h"></i>
    </button>

    <!-- Top right settings button -->
    <button class="settings-btn" id="settings-btn" aria-label="Settings">
        <i class="fas fa-cog"></i>
    </button>

    <!-- Theme toggle button (bottom right) -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Main container -->
    <div class="main-container">
        <!-- Player Toolbar -->
        <div class="player-toolbar">
            <input type="file" id="file-input" accept="audio/mpeg, audio/wav, audio/x-wav" hidden>
            <button class="toolbar-btn" id="load-btn" aria-label="Load File">
                <i class="fas fa-upload"></i>
                <span>Load</span>
            </button>
            <button class="toolbar-btn" id="play-pause-btn" aria-label="Play/Pause" disabled>
                <i class="fas fa-play"></i>
                <span>Play</span>
            </button>
            <button class="toolbar-btn" id="stop-btn" aria-label="Stop" disabled>
                <i class="fas fa-stop"></i>
                <span>Stop</span>
            </button>
            <button class="toolbar-btn" id="rewind-btn" aria-label="Rewind" disabled>
                <i class="fas fa-backward"></i>
                <span>Rewind</span>
            </button>
            <button class="toolbar-btn" id="repeat-btn" aria-label="Repeat" data-repeat="off">
                <i class="fas fa-redo"></i>
                <span>Repeat</span>
            </button>
            <button class="toolbar-btn" id="toolbar-download-btn" aria-label="Download" disabled>
                <i class="fas fa-download"></i>
                <span>Download</span>
            </button>
        </div>

        <!-- Control panel -->
        <div class="control-panel">
            <!-- Speed Control -->
            <div class="control-group">
                <div class="knob-container">
                    <div class="knob-markers">
                        <span class="marker marker-min">75%</span>
                        <span class="marker marker-mid">100%</span>
                        <span class="marker marker-max">125%</span>
                    </div>
                    <div class="knob-wrapper">
                        <input type="range" id="speed-knob" min="50" max="150" value="100" class="input-knob" data-diameter="120">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
                <div class="control-label">
                    <div class="label-name">SPEED</div>
                    <div class="label-value" id="speed-value">100%</div>
                </div>
            </div>

            <!-- Center cassette icon -->
            <div class="cassette-icon" id="cassette-icon">
                <svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="cassetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--cassette-color-1);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--cassette-color-2);stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="10" y="15" width="100" height="50" rx="4" fill="url(#cassetteGrad)" opacity="0.9"/>
                    <rect x="15" y="20" width="90" height="40" rx="3" fill="var(--bg-color)" opacity="0.2"/>
                    <circle cx="35" cy="40" r="10" stroke="var(--bg-color)" stroke-width="2" fill="none"/>
                    <circle cx="85" cy="40" r="10" stroke="var(--bg-color)" stroke-width="2" fill="none"/>
                    <circle cx="35" cy="40" r="5" fill="var(--bg-color)" opacity="0.4"/>
                    <circle cx="85" cy="40" r="5" fill="var(--bg-color)" opacity="0.4"/>
                    <path d="M45 40 Q60 35 75 40" stroke="var(--bg-color)" stroke-width="1.5" fill="none" opacity="0.6"/>
                    <rect x="50" y="25" width="20" height="8" rx="2" fill="var(--bg-color)" opacity="0.3"/>
                    <!-- Screws icon overlay -->
                    <g transform="translate(45, 30)">
                        <path d="M8 0 L12 4 L8 8 L4 4 Z" fill="var(--bg-color)" opacity="0.5"/>
                        <path d="M18 0 L22 4 L18 8 L14 4 Z" fill="var(--bg-color)" opacity="0.5"/>
                        <line x1="10" y1="4" x2="10" y2="12" stroke="var(--bg-color)" stroke-width="1.5" opacity="0.5"/>
                        <line x1="20" y1="4" x2="20" y2="12" stroke="var(--bg-color)" stroke-width="1.5" opacity="0.5"/>
                    </g>
                </svg>
            </div>

            <!-- Pitch Control -->
            <div class="control-group">
                <div class="knob-container">
                    <div class="knob-markers">
                        <span class="marker marker-min">-6</span>
                        <span class="marker marker-mid">0</span>
                        <span class="marker marker-max">+6</span>
                    </div>
                    <div class="knob-wrapper">
                        <input type="range" id="pitch-knob" min="-6" max="6" value="0" step="0.1" class="input-knob" data-diameter="120">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
                <div class="control-label">
                    <div class="label-name">PITCH</div>
                    <div class="label-value" id="pitch-value">0.0 st</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom tagline -->
    <div class="tagline">
        <span class="halfscrew-text">HALFSCREW</span>
        <h1 class="main-title">THE <span class="accent-word">SLOW</span> MOTION POTION</h1>
        <p class="subtitle">TUNED TO KEEP THE <span class="low-end">LOW END</span> WHERE IT BELONGS</p>
        <button class="controls-link" id="controls-link">CONTROLS ›</button>
    </div>

    <!-- Hidden audio player for Tone.js -->
    <audio id="audio-player" style="display: none;"></audio>

    <!-- EQ Modal -->
    <div id="eq-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content eq-modal-content">
            <button class="modal-close" id="eq-close">&times;</button>
            <h2>EQ & Visualizer</h2>
            <div class="eq-content">
                <div class="eq-band">
                    <div class="eq-meter">
                        <span class="db-value" id="low-db">0 dB</span>
                        <div class="visualizer-bar" id="low-visualizer"></div>
                    </div>
                    <input type="range" id="low-eq" class="vertical-slider" min="-12" max="12" value="0" step="0.5">
                    <label for="low-eq">Low</label>
                </div>
                <div class="eq-band">
                    <div class="eq-meter">
                        <span class="db-value" id="mid-db">0 dB</span>
                        <div class="visualizer-bar" id="mid-visualizer"></div>
                    </div>
                    <input type="range" id="mid-eq" class="vertical-slider" min="-12" max="12" value="0" step="0.5">
                    <label for="mid-eq">Mid</label>
                </div>
                <div class="eq-band">
                    <div class="eq-meter">
                        <span class="db-value" id="high-db">0 dB</span>
                        <div class="visualizer-bar" id="high-visualizer"></div>
                    </div>
                    <input type="range" id="high-eq" class="vertical-slider" min="-12" max="12" value="0" step="0.5">
                    <label for="high-eq">High</label>
                </div>
            </div>
            <button class="bypass-btn" id="eq-bypass-btn">
                <span class="bypass-text">Bypass</span>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" id="settings-close">&times;</button>
            <h2>Settings</h2>
            <div class="settings-content">
                <div class="setting-group">
                    <label for="wet-dry-mix">Wet/Dry Mix</label>
                    <input type="range" id="wet-dry-mix" min="0" max="1" value="0.5" step="0.01">
                    <span id="wet-dry-value">50%</span>
                </div>
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="lufs-normalize">
                        LUFS Normalization
                    </label>
                </div>
                <div class="modal-buttons">
                    <button id="play-button" disabled>
                        <i class="fas fa-play"></i> Play
                    </button>
                    <button id="download-button" disabled>
                        <i class="fas fa-download"></i> Download
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
    <script src="lib/input-knobs.js"></script>
    <script src="script.js"></script>
</body>
</html>
