<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Professional Studio Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Studio Interface</h1>
        <div class="controls">
            <div class="control">
                <label for="time-shift">Time Shift</label>
                <div class="knob-wrapper">
                    <input type="range" id="time-shift" min="50" max="200" value="100" class="input-knob" data-diameter="80" data-bgcolor="#e0e5ec" data-fgcolor="#a3b1c6" disabled>
                </div>
                <span id="time-shift-value">100%</span>
            </div>
            <div class="control">
                <label for="pitch-bend">Pitch Bend</label>
                <div class="knob-wrapper">
                    <input type="range" id="pitch-bend" min="-12" max="12" value="0" step="0.1" class="input-knob" data-diameter="80" data-bgcolor="#e0e5ec" data-fgcolor="#a3b1c6" disabled>
                </div>
                <span id="pitch-bend-value">0st</span>
            </div>
        </div>
        <div class="slider-control">
            <label for="wet-dry-mix">Wet/Dry Mix</label>
            <input type="range" id="wet-dry-mix" min="0" max="1" value="0.5" step="0.01" class="slider" disabled>
            <span id="wet-dry-mix-value">0.5</span>
        </div>
        <div class="checkbox-controls">
            <label>
                <input type="checkbox" id="eq-enable" disabled>
                EQ Controls
            </label>
            <label>
                <input type="checkbox" id="lufs-normalize" disabled>
                Spotify LUFS Normalization
            </label>
        </div>
        <div class="io-controls">
            <input type="file" id="file-input" accept="audio/mp3,audio/wav,audio/mpeg,audio/x-wav" disabled>
            <button id="play-button" disabled>Play</button>
            <button id="download-button" disabled>Download</button>
            <button id="presets-button" disabled>Presets</button>
            <button id="login-button">Login</button>
        </div>
        <audio id="audio-player" controls></audio>
    </div>

    <!-- Login/Signup Modal -->
    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Login</h2>
            <form id="auth-form">
                <input type="email" id="email-input" placeholder="Email" required>
                <input type="password" id="password-input" placeholder="Password" required>
                <button type="submit" id="auth-submit-button">Login</button>
            </form>
            <p id="auth-switch-text">Don't have an account? <a href="#" id="auth-switch-link">Sign Up</a></p>
        </div>
    </div>

    <!-- EQ Modal -->
    <div id="eq-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content eq-modal-content">
            <h2>EQ Controls</h2>
            <div class="eq-controls">
                <div class="control">
                    <label for="low-eq">Low</label>
                    <div class="knob-wrapper">
                        <input type="range" id="low-eq" min="-12" max="12" value="0" step="0.5" class="input-knob" data-diameter="60" data-bgcolor="#e0e5ec" data-fgcolor="#4a90e2">
                    </div>
                    <span id="low-eq-value">0 dB</span>
                </div>
                <div class="control">
                    <label for="mid-eq">Mid</label>
                    <div class="knob-wrapper">
                        <input type="range" id="mid-eq" min="-12" max="12" value="0" step="0.5" class="input-knob" data-diameter="60" data-bgcolor="#e0e5ec" data-fgcolor="#4a90e2">
                    </div>
                    <span id="mid-eq-value">0 dB</span>
                </div>
                <div class="control">
                    <label for="high-eq">High</label>
                    <div class="knob-wrapper">
                        <input type="range" id="high-eq" min="-12" max="12" value="0" step="0.5" class="input-knob" data-diameter="60" data-bgcolor="#e0e5ec" data-fgcolor="#4a90e2">
                    </div>
                    <span id="high-eq-value">0 dB</span>
                </div>
            </div>
            <button id="eq-close-button">Close</button>
        </div>
    </div>

    <!-- Presets Modal -->
    <div id="presets-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content presets-modal-content">
            <h2>Audio Presets</h2>
            <div class="presets-list">
                <button class="preset-button" data-preset="vocal-enhance">Vocal Enhance</button>
                <button class="preset-button" data-preset="bass-boost">Bass Boost</button>
                <button class="preset-button" data-preset="treble-boost">Treble Boost</button>
                <button class="preset-button" data-preset="radio-ready">Radio Ready</button>
                <button class="preset-button" data-preset="chipmunk">Chipmunk Voice</button>
                <button class="preset-button" data-preset="slow-deep">Slow & Deep</button>
                <button class="preset-button" data-preset="reset">Reset All</button>
            </div>
            <button id="presets-close-button">Close</button>
        </div>
    </div>

    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script src="lib/input-knobs.js"></script>
    <script src="script.js"></script>
</body>
</html>
