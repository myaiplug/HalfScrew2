<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalfScrew - Premium Audio Time-Stretch & Pitch-Shift Plugin</title>
    <meta name="description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently. Real-time processing with beautiful UI.">
    <meta name="keywords" content="audio plugin, time stretch, pitch shift, audio processing, web audio, tone.js, audio editor">
    <meta name="author" content="myaiplug">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://myaiplug.github.io/HalfScrew2/">
    <meta property="og:title" content="HalfScrew - Premium Audio Time-Stretch & Pitch-Shift Plugin">
    <meta property="og:description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently.">
    <meta property="og:image" content="https://github.com/user-attachments/assets/392f95b3-95f2-43d6-a5c6-5eed15be92ee">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://myaiplug.github.io/HalfScrew2/">
    <meta property="twitter:title" content="HalfScrew - Premium Audio Time-Stretch & Pitch-Shift Plugin">
    <meta property="twitter:description" content="Professional web-based audio plugin for time-stretching and pitch-shifting. Change speed without affecting pitch, or adjust pitch independently.">
    <meta property="twitter:image" content="https://github.com/user-attachments/assets/392f95b3-95f2-43d6-a5c6-5eed15be92ee">
    
    <!-- Favicon (using emoji as data URI for now) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Drawer Toggle Buttons -->
        <button class="drawer-toggle drawer-toggle-left" title="Toggle Left Drawer">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="drawer-toggle drawer-toggle-right" title="Toggle Right Drawer">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="drawer-toggle drawer-toggle-top" title="Toggle Top Drawer">
            <i class="fas fa-chevron-down"></i>
        </button>
        
        <div class="header">
            <div class="logo">
                <i class="fas fa-wave-square"></i>
            </div>
            <h1>HalfScrew</h1>
            <div class="version">v1.0</div>
        </div>
        <div class="status-bar">
            <span id="status-indicator" class="status-ready">Ready</span>
        </div>
        <div class="controls">
            <div class="control">
                <label for="time-shift">Time Shift</label>
                <div class="knob-wrapper">
                    <input type="range" id="time-shift" min="50" max="150" value="100" class="input-knob" data-diameter="70" data-bgcolor="#e0e5ec" data-fgcolor="#4a9eff">
                </div>
                <span id="time-shift-value" class="value-display">100<span class="unit">%</span></span>
            </div>
            <div class="control">
                <label for="pitch-bend">Pitch Bend</label>
                <div class="knob-wrapper">
                    <input type="range" id="pitch-bend" min="-6" max="6" value="0" step="0.1" class="input-knob" data-diameter="70" data-bgcolor="#e0e5ec" data-fgcolor="#4a9eff">
                </div>
                <span id="pitch-bend-value" class="value-display">0<span class="unit">st</span></span>
            </div>
        </div>
        <div class="slider-control">
            <label for="wet-dry-mix">Wet/Dry Mix</label>
            <div class="slider-container">
                <span class="slider-label">Dry</span>
                <input type="range" id="wet-dry-mix" min="0" max="1" value="0.5" step="0.01" class="slider">
                <span class="slider-label">Wet</span>
            </div>
            <span id="wet-dry-mix-value" class="value-display">50<span class="unit">%</span></span>
        </div>
        <div class="checkbox-controls">
            <label>
                <input type="checkbox" id="eq-enable">
                EQ Controls
            </label>
            <label>
                <input type="checkbox" id="lufs-normalize">
                Spotify LUFS Normalization
            </label>
        </div>
        <div class="io-controls">
            <label for="file-input" class="file-input-label" id="file-input-label">
                <i class="fas fa-folder-open"></i>
                <span>Choose File</span>
                <input type="file" id="file-input" accept="audio/mp3, audio/wav">
            </label>
            <button id="play-button">
                <i class="fas fa-play"></i>
                <span>Play</span>
            </button>
            <button id="download-button" disabled>
                <i class="fas fa-download"></i>
                <span>Download</span>
            </button>
            <button id="login-button">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </button>
        </div>
        <div class="visualizer">
            <canvas id="audio-visualizer"></canvas>
        </div>
        <audio id="audio-player" controls></audio>
    </div>

    <!-- Tagline -->
    <div class="tagline">
        The <span class="accent">Slow</span> Motion Motion
    </div>

    <!-- Login/Signup Modal -->
    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Login</h2>
            <form id="auth-form">
                <input type="email" id="email-input" placeholder="Email" required>
                <input type="password" id="password-input" placeholder="Password" required>
                <button type="submit" id="auth-submit-button">Login</button>
            </form>
            <p id="auth-switch-text">Don't have an account? <a href="#" id="auth-switch-link">Sign Up</a></p>
        </div>
    </div>

    <!-- Email Collection Modal for Downloads -->
    <div id="download-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content download-modal-content">
            <button class="modal-close" id="download-modal-close">&times;</button>
            <div class="modal-icon">
                <i class="fas fa-download"></i>
            </div>
            <h2>Download Your Audio</h2>
            <p class="modal-subtitle">Enter your email to receive your processed audio file</p>
            <form id="download-email-form">
                <input type="email" id="download-email-input" placeholder="Enter your email" required>
                <button type="submit" id="download-submit-button">
                    <i class="fas fa-paper-plane"></i>
                    <span>Submit & Download</span>
                </button>
            </form>
        </div>
    </div>

    <!-- EQ Modal -->
    <div id="eq-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content eq-modal-content">
            <h2>EQ Controls</h2>
            <div class="eq-controls">
                <div class="control">
                    <label for="low-eq">Low</label>
                    <div class="knob-wrapper">
                        <input type="range" id="low-eq" min="-12" max="12" value="0" step="0.5" class="input-knob" data-diameter="60" data-bgcolor="#e0e5ec" data-fgcolor="#4a90e2">
                    </div>
                    <span id="low-eq-value">0 dB</span>
                </div>
                <div class="control">
                    <label for="mid-eq">Mid</label>
                    <div class="knob-wrapper">
                        <input type="range" id="mid-eq" min="-12" max="12" value="0" step="0.5" class="input-knob" data-diameter="60" data-bgcolor="#e0e5ec" data-fgcolor="#4a90e2">
                    </div>
                    <span id="mid-eq-value">0 dB</span>
                </div>
                <div class="control">
                    <label for="high-eq">High</label>
                    <div class="knob-wrapper">
                        <input type="range" id="high-eq" min="-12" max="12" value="0" step="0.5" class="input-knob" data-diameter="60" data-bgcolor="#e0e5ec" data-fgcolor="#4a90e2">
                    </div>
                    <span id="high-eq-value">0 dB</span>
                </div>
            </div>
            <button id="eq-close-button">Close</button>
        </div>
    </div>

    <!-- Presets Modal -->
    <div id="presets-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content presets-modal-content">
            <h2>Audio Presets</h2>
            <div class="presets-list">
                <button class="preset-button" data-preset="vocal-enhance">Vocal Enhance</button>
                <button class="preset-button" data-preset="bass-boost">Bass Boost</button>
                <button class="preset-button" data-preset="treble-boost">Treble Boost</button>
                <button class="preset-button" data-preset="radio-ready">Radio Ready</button>
                <button class="preset-button" data-preset="chipmunk">Chipmunk Voice</button>
                <button class="preset-button" data-preset="slow-deep">Slow & Deep</button>
                <button class="preset-button" data-preset="reset">Reset All</button>
            </div>
            <button id="presets-close-button">Close</button>
        </div>
    </div>

    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script src="lib/input-knobs.js"></script>
    <script src="script.js"></script>
</body>
</html>
